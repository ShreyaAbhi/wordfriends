<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Word Friends</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap');

  :root{
    --bg1:#fff6e9;
    --bg2:#ffe3ef;
    --ink:#3a2e4f;
    --card:#ffffff;
    --shadow: 0 22px 50px -18px rgba(120,80,160,.45);
    /* shared playful palette, reused by the celebration effects */
    --c1:#ff8fab; --c2:#ffd6a5; --c3:#b8f2e6; --c4:#cdb4ff; --c5:#9bf6ff; --c6:#ffc8dd;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Fredoka',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 18% 12%, #ffd6a5 0, transparent 42%),
      radial-gradient(circle at 85% 18%, #b8f2e6 0, transparent 40%),
      radial-gradient(circle at 25% 88%, #ffc8dd 0, transparent 45%),
      radial-gradient(circle at 80% 85%, #cdb4ff 0, transparent 42%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    display:flex;
    flex-direction:column;
    height:100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* floating decorative dots (idle ambiance) */
  .deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .deco span{position:absolute;border-radius:50%;opacity:.35;animation:float 9s ease-in-out infinite;}
  .deco span:nth-child(1){width:60px;height:60px;background:var(--c2);left:6%;top:20%;animation-delay:0s;}
  .deco span:nth-child(2){width:40px;height:40px;background:var(--c5);right:9%;top:30%;animation-delay:1.5s;}
  .deco span:nth-child(3){width:80px;height:80px;background:var(--c4);left:12%;bottom:14%;animation-delay:.8s;}
  .deco span:nth-child(4){width:34px;height:34px;background:var(--c3);right:14%;bottom:22%;animation-delay:2.2s;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}

  /* celebration layer sits above background, below the card/UI */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}

  header{
    text-align:center;
    padding:10px 12px 2px;
    z-index:3;
    flex:0 0 auto;
  }
  header h1{
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:clamp(18px,4.6vw,30px);
    color:#ff6f91;
    letter-spacing:.5px;
    text-shadow:0 2px 0 #fff;
  }
  .counter{
    display:inline-block;
    margin-top:2px;
    font-size:clamp(13px,3.4vw,16px);
    color:#9a86b8;
    font-weight:600;
    cursor:pointer;
    padding:3px 12px;
    border-radius:14px;
    border:2px dashed #e6d8f5;
    background:rgba(255,255,255,.5);
  }
  .counter:active{transform:scale(.96);}

  .stage{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(8px,2.5vw,28px);
    padding:6px clamp(8px,3vw,24px);
    z-index:3;
    min-height:0;
  }

  .arrow{
    flex:0 0 auto;
    width:clamp(58px,13vw,100px);
    height:clamp(58px,13vw,100px);
    border:none;
    border-radius:50%;
    cursor:pointer;
    font-size:clamp(30px,8vw,52px);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
    transition:transform .12s ease, filter .12s ease;
    line-height:1;
    padding-bottom:4px;
  }
  .arrow.left{background:linear-gradient(145deg,#ffa8c5,#ff6f91);}
  .arrow.right{background:linear-gradient(145deg,#8ee0d0,#3fb89f);}
  .arrow:active{transform:scale(.88);filter:brightness(1.05);}

  .card{
    flex:1 1 auto;
    width:100%;
    max-width:560px;
    height:100%;
    background:var(--card);
    border-radius:clamp(24px,4vw,38px);
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:clamp(12px,3.5vw,30px);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    border:6px solid #fff;
    min-height:0;
  }
  .card::before{
    content:"";
    position:absolute;inset:0;
    background:radial-gradient(circle at 50% 30%, rgba(255,221,196,.35), transparent 60%);
    pointer-events:none;
  }

  .word{
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:clamp(30px,7.5vw,60px);
    color:#4b3b6b;
    text-align:center;
    line-height:1.05;
    z-index:1;
    flex:0 0 auto;
    will-change:filter, opacity;
  }
  /* Vocabulary mode: the WORD blurs into focus over 2s */
  .word.reveal{ animation:wordreveal 2s ease forwards; }
  /* Spelling mode: a quicker 1s blur-in for the word */
  .word.reveal-fast{ animation:wordreveal 1s ease forwards; }
  @keyframes wordreveal{
    0%   { filter:blur(18px); opacity:.2; }
    60%  { opacity:1; }
    100% { filter:blur(0);    opacity:1; }
  }
  .word.wordwaiting{ opacity:0; filter:blur(18px); }

  /* Spelling mode: individual letters that can light up as they're spelled */
  .word .lt{
    display:inline-block;
    transition:color .15s ease;
    will-change:transform, color;
  }
  .word .lt.space{ width:.35em; }   /* gap for spaces */
  .word .lt.lit{
    color:#ff6f91;
    animation:letterpop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes letterpop{
    0%   { transform:scale(1);   }
    40%  { transform:scale(1.5) translateY(-6px); }
    100% { transform:scale(1);   }
  }
  .emoji-wrap{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:clamp(6px,2vh,18px);
    position:relative;
  }
  .emoji{
    /* size from the smaller viewport side so it never clips in landscape */
    font-size:min(34vw, 46vh);
    line-height:1;
    z-index:1;
    will-change:filter, transform, opacity;
  }
  /* blur reveal: starts blurred+faint, animates clear over 2s */
  .emoji.reveal{ animation:reveal 2s ease forwards; }
  @keyframes reveal{
    0%   { filter:blur(26px); opacity:.25; transform:scale(.86); }
    60%  { opacity:1; }
    100% { filter:blur(0);    opacity:1;   transform:scale(1); }
  }
  /* during the 3s gap the picture is hidden so the word shows alone first */
  .emoji.waiting{ opacity:0; filter:blur(26px); transform:scale(.86); }
  /* when locked (after a tap), force fully sharp regardless of animation */
  .emoji.locked{ animation:none !important; filter:blur(0) !important; opacity:1 !important; transform:scale(1) !important; }
  /* but still allow the celebratory wiggle to play on tap */
  .emoji.locked.wiggle{ animation:wiggle .5s ease !important; transform:none !important; }

  .wiggle{animation:wiggle .5s ease;}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}

  /* Idle hint: a translucent hand that taps the picture after inactivity */
  .tap-hand{
    position:absolute;
    left:50%; top:58%;
    font-size:min(16vw, 20vh);
    opacity:0;
    pointer-events:none;
    z-index:4;
    filter:drop-shadow(0 4px 6px rgba(90,60,130,.35));
    transform:translate(-30%,0);
  }
  .tap-hand.show{ animation:handtap 1.6s ease-in-out 2; }
  @keyframes handtap{
    0%   { opacity:0;   transform:translate(-30%,-22%) scale(1.05); }
    18%  { opacity:.85; transform:translate(-30%,-10%) scale(1.02); }
    34%  { opacity:.9;  transform:translate(-30%,2%)   scale(.9);  } /* tap down */
    50%  { opacity:.85; transform:translate(-30%,-10%) scale(1.02); }
    70%  { opacity:.9;  transform:translate(-30%,2%)   scale(.9);  } /* tap again */
    86%  { opacity:.55; transform:translate(-30%,-10%) scale(1.02); }
    100% { opacity:0;   transform:translate(-30%,-22%) scale(1.05); }
  }
  /* expanding ripple under the hand on each tap */
  .tap-ring{
    position:absolute;
    left:50%; top:60%;
    width:30px;height:30px;
    margin:-15px 0 0 -15px;
    border-radius:50%;
    border:3px solid var(--c1);
    opacity:0;
    pointer-events:none;
    z-index:3;
  }
  .tap-ring.show{ animation:tapring 1.6s ease-out 2; }
  @keyframes tapring{
    0%,8%   { opacity:0;   transform:scale(.2); }
    34%     { opacity:.55; transform:scale(1);  }
    50%     { opacity:0;   transform:scale(1.8);}
    58%     { opacity:0;   transform:scale(.2); }
    70%     { opacity:.55; transform:scale(1);  }
    86%,100%{ opacity:0;   transform:scale(1.8);}
  }

  .card.pop{animation:pop .42s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

  footer{
    text-align:center;
    padding:4px 12px 10px;
    z-index:3;
    flex:0 0 auto;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .toggle{
    background:#fff;
    border:2px solid #ffd1e0;
    border-radius:20px;
    padding:6px 14px;
    font-family:'Fredoka';
    font-weight:600;
    color:#ff6f91;
    cursor:pointer;
    font-size:13px;
    transition:opacity .15s ease, filter .15s ease;
  }
  .toggle.off{
    opacity:.55;
    border-color:#e3d8ee;
    color:#a294b8;
  }

  /* ---- Landscape layout: keep arrows on the sides, shrink chrome ---- */
  @media (orientation: landscape){
    header{padding:4px 12px 0;}
    header h1{font-size:clamp(15px,3.4vh,24px);}
    .counter{font-size:clamp(11px,2.6vh,15px);margin-top:1px;padding:2px 10px;}
    .stage{padding:4px clamp(8px,2vw,20px);gap:clamp(8px,2vw,24px);}
    .arrow{width:clamp(50px,11vh,86px);height:clamp(50px,11vh,86px);font-size:clamp(26px,7vh,46px);}
    .word{font-size:clamp(24px,6.5vh,52px);}
    .emoji{font-size:min(40vh, 30vw);}  /* height-driven so it fits the short axis */
    .emoji-wrap{margin-top:clamp(2px,1vh,10px);}
    .tap-hand{font-size:min(18vh, 14vw);}
    footer{padding:2px 12px 6px;}
  }

  /* jump-to-page dialog */
  .modal{
    position:fixed;inset:0;z-index:10;
    background:rgba(60,40,80,.45);
    display:none;align-items:center;justify-content:center;
    padding:20px;
    backdrop-filter:blur(3px);
  }
  .modal.open{display:flex;}
  .modal-box{
    background:#fff;border-radius:26px;padding:26px 24px;
    width:min(340px,92vw);text-align:center;
    box-shadow:var(--shadow);
  }
  .modal-box h2{font-family:'Baloo 2';color:#ff6f91;font-size:22px;margin-bottom:4px;}
  .modal-box p{color:#9a86b8;font-size:14px;margin-bottom:14px;}
  .modal-box input{
    width:100%;font-family:'Baloo 2';font-size:30px;text-align:center;
    padding:10px;border:3px solid #ffd1e0;border-radius:16px;color:#4b3b6b;
    outline:none;-moz-appearance:textfield;
  }
  .modal-box input::-webkit-outer-spin-button,
  .modal-box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .modal-btns{display:flex;gap:10px;margin-top:16px;}
  .modal-btns button{
    flex:1;border:none;border-radius:16px;padding:12px;cursor:pointer;
    font-family:'Fredoka';font-weight:700;font-size:16px;
  }
  .btn-go{background:linear-gradient(145deg,#8ee0d0,#3fb89f);color:#fff;}
  .btn-cancel{background:#f0ebf7;color:#9a86b8;}

  #audioNote{
    position:fixed;
    left:50%; bottom:64px;
    transform:translateX(-50%);
    z-index:20;
    max-width:min(440px,92vw);
    background:#4b3b6b;
    color:#fff;
    font-family:'Fredoka';
    font-size:13px;
    line-height:1.35;
    padding:12px 16px;
    border-radius:16px;
    box-shadow:var(--shadow);
    text-align:center;
    opacity:1;
    transition:opacity 1.5s ease;
  }
  #audioNote.fade{opacity:0;}

  /* ---------- Landing screen ---------- */
  #landing{
    position:fixed; inset:0; z-index:8;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:clamp(14px,3vh,26px);
    padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top));
  }
  #landing h1{
    font-family:'Baloo 2',cursive; font-weight:800;
    font-size:clamp(28px,8vw,52px);
    color:#ff6f91; text-shadow:0 3px 0 #fff;
    text-align:center; margin-bottom:clamp(6px,2vh,18px);
  }
  #landing .subtitle{
    font-family:'Fredoka'; color:#9a86b8; font-weight:600;
    font-size:clamp(13px,3.4vw,17px); margin-top:-10px; margin-bottom:8px;
    text-align:center;
  }
  .mode-btn{
    width:min(420px,90vw);
    border:none; cursor:pointer;
    border-radius:26px;
    padding:clamp(16px,2.6vh,26px) 22px;
    font-family:'Baloo 2',cursive; font-weight:700;
    font-size:clamp(18px,5vw,26px);
    color:#fff; text-align:left;
    box-shadow:var(--shadow);
    display:flex; align-items:center; gap:16px;
    transition:transform .12s ease, filter .12s ease;
  }
  .mode-btn:active{ transform:scale(.96); filter:brightness(1.05); }
  .mode-btn .ico{ font-size:1.5em; line-height:1; }
  .mode-btn .sub{ display:block; font-family:'Fredoka'; font-weight:500; font-size:.62em; opacity:.92; margin-top:2px; }
  .mode-vocab{ background:linear-gradient(135deg,#ffb3c8,#ff6f91); }
  .mode-spell{ background:linear-gradient(135deg,#9ad9ff,#5ab0e0); }
  .mode-phrase{ background:linear-gradient(135deg,#a8e6cf,#3fb89f); }

  /* Back button (shown only inside a mode) */
  #backBtn{
    position:fixed; left:calc(10px + env(safe-area-inset-left));
    top:calc(8px + env(safe-area-inset-top));
    z-index:6;
    display:none;
    background:#fff; border:2px solid #ffd1e0; border-radius:18px;
    padding:7px 14px; cursor:pointer;
    font-family:'Fredoka'; font-weight:700; font-size:14px; color:#ff6f91;
    box-shadow:0 6px 16px -6px rgba(120,80,160,.4);
  }
  #backBtn:active{ transform:scale(.94); }
  body.in-mode #backBtn{ display:inline-block; }

  /* hide the main app UI until a mode is chosen */
  body:not(.in-mode) header,
  body:not(.in-mode) .stage,
  body:not(.in-mode) footer{ display:none; }
  /* hide landing once in a mode */
  body.in-mode #landing{ display:none; }

</style>
</head>
<body>
  <div class="deco"><span></span><span></span><span></span><span></span></div>
  <canvas id="fx"></canvas>

  <!-- Landing screen -->
  <div id="landing">
    <h1>🌈 Word Friends 🌈</h1>
    <div class="subtitle">Choose an activity</div>
    <button class="mode-btn mode-vocab" data-mode="vocab">
      <span class="ico">📚</span>
      <span>Build Vocabulary<span class="sub">See the picture, learn the word</span></span>
    </button>
    <button class="mode-btn mode-spell" data-mode="spell">
      <span class="ico">🔤</span>
      <span>Build Spelling<span class="sub">Hear the word, then its letters</span></span>
    </button>
    <button class="mode-btn mode-phrase" data-mode="phrase">
      <span class="ico">💬</span>
      <span>Build Functional Phrases<span class="sub">Everyday phrases to talk &amp; ask</span></span>
    </button>
  </div>

  <!-- Back to menu -->
  <button id="backBtn" aria-label="Back to menu">‹ Menu</button>

  <header>
    <h1>🌈 Word Friends 🌈</h1>
    <div class="counter" id="counter" title="Tap to jump to a word">Word 1</div>
  </header>

  <div class="stage" id="stage">
    <button class="arrow left" id="prev" aria-label="Previous word">‹</button>

    <div class="card" id="card" role="button" aria-label="Tap to hear the word again">
      <div class="word" id="word">Dog</div>
      <div class="emoji-wrap">
        <div class="emoji" id="emoji">🐶</div>
        <div class="tap-ring" id="tapRing" aria-hidden="true"></div>
        <div class="tap-hand" id="tapHand" aria-hidden="true">👆</div>
      </div>
    </div>

    <button class="arrow right" id="next" aria-label="Next word">›</button>
  </div>

  <footer>
    <button class="toggle off" id="soundToggle">🔇 Sound: Off</button>
    <button class="toggle off" id="musicToggle">🎵 Music: Off</button>
  </footer>

  <!-- Jump-to-page dialog -->
  <div class="modal" id="jumpModal">
    <div class="modal-box">
      <h2>Go to a word</h2>
      <p id="jumpHint">Enter a number from 1 to 779</p>
      <input id="jumpInput" type="number" inputmode="numeric" min="1" placeholder="1">
      <div class="modal-btns">
        <button class="btn-cancel" id="jumpCancel">Cancel</button>
        <button class="btn-go" id="jumpGo">Go!</button>
      </div>
    </div>
  </div>

/* Uses the artifact persistent-storage API (window.storage). Falls back
   gracefully to in-memory only if unavailable. Saves on every change and
   on exit, restores on load. Each mode keeps its own position. */
let saveQueued = false;
function currentKey(){ return mode && MODES[mode] ? MODES[mode].key : null; }

// Prefer localStorage (works on a real website like GitHub Pages).
// Fall back to window.storage (only present inside the Claude preview).
function hasLocalStorage(){
  try{ const k='__wf_test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
const LS_OK = hasLocalStorage();

async function saveProgress(){
  const key = currentKey();
  if(!key) return;
  try{
    if(LS_OK){
      localStorage.setItem(key, String(idx));
    } else if(window.storage && window.storage.set){
      await window.storage.set(key, String(idx), false);
    }
  }catch(e){/* ignore */}
}
function queueSave(){
  if(saveQueued) return;
  saveQueued = true;
  setTimeout(()=>{ saveQueued = false; saveProgress(); }, 400);
}
// Load the saved position for a specific mode; returns the index (0 if none).
async function loadProgressFor(m){
  const validate = (raw)=>{
    const n = parseInt(raw, 10);
    return (!isNaN(n) && n >= 0 && n < MODES[m].data.length) ? n : 0;
  };
  try{
    if(LS_OK){
      const raw = localStorage.getItem(MODES[m].key);
      if(raw != null) return validate(raw);
    } else if(window.storage && window.storage.get){
      const res = await window.storage.get(MODES[m].key, false);
      if(res && res.value != null) return validate(res.value);
    }
  }catch(e){/* ignore */}
  return 0;
}
// Save when leaving / backgrounding the app.
window.addEventListener('pagehide', saveProgress);
window.addEventListener('beforeunload', saveProgress);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveProgress(); });

  const en = voices.filter(v => /en[-_]/i.test(v.lang) || /english/i.test(v.name));

  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if(v) u.voice = v;
    u.rate = 0.82;
    u.pitch = 1.15;
    u.volume = 1;
    if(onDone){
      let fired = false;
      const done = ()=>{ if(fired) return; fired = true; onDone(); };
      u.onend = done;
      u.onerror = done;
      // Time-based fallback in case onend never fires (cold engine on first load).
      setTimeout(done, 700 + text.length*140);
    }
    speechSynthesis.speak(u);
  }catch(e){ if(onDone) onDone(); }
}

/* ========================================================================
   WEB AUDIO ENGINE — synthesized effects + gentle xylophone background music
   (no audio files needed; everything is generated in the browser)
   ======================================================================== */
let audioCtx = null;
function getCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ audioCtx = null; }
  }
  // browsers start the context suspended until a user gesture
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume().catch(()=>{}); }
  return audioCtx;
}

// Short confirmation chime so you can immediately tell if audio works here.
function chime(){
  const ctx = getCtx(); if(!ctx) return;
  ensureGains();
  const t = ctx.currentTime;
  [523.25, 659.25, 783.99].forEach((f,i)=>{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='triangle'; o.frequency.value=f;
    const s = t + i*0.12;
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(0.25, s+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, s+0.4);
    o.connect(g); g.connect(sfxGain); o.start(s); o.stop(s+0.42);
  });
}

// A soft piano-like note: layered sine partials with a gentle attack and a
// warm, longer decay (much softer than the old xylophone).
function playNote(freq, when, dur, gain){
  const ctx = getCtx(); if(!ctx) return;
  const t = when ?? ctx.currentTime;
  const length = dur ?? 0.9;
  const peak = (gain ?? 0.12);

  const g = ctx.createGain();
  g.connect(masterMusicGain || ctx.destination);
  // gentle piano-ish envelope: soft attack, gradual decay (not percussive)
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.04);
  g.gain.exponentialRampToValueAtTime(peak * 0.5, t + length * 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, t + length);

  // harmonic partials give a rounded piano character; higher ones quieter
  const partials = [
    {mult:1,    type:'sine',     level:1.0},
    {mult:2,    type:'sine',     level:0.32},
    {mult:3,    type:'triangle', level:0.12}
  ];
  const oscs = partials.map(p=>{
    const o = ctx.createOscillator();
    const pg = ctx.createGain();
    o.type = p.type; o.frequency.value = freq * p.mult;
    pg.gain.value = p.level;
    o.connect(pg); pg.connect(g);
    o.start(t); o.stop(t + length + 0.1);
    return o;
  });
}

/* ---------- Celebration sound effects (tied to the visuals) ---------- */
function sfxBubbles(){
  const ctx = getCtx(); if(!ctx || !soundOn) return;
  ensureGains();
  // a few rising "bloop" notes
  const base = [523.25, 587.33, 659.25, 783.99];
  base.forEach((f,i)=>{
    const t = ctx.currentTime + i*0.08;
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.type='sine'; osc.frequency.setValueAtTime(f*0.8, t);
    osc.frequency.exponentialRampToValueAtTime(f, t+0.12);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.14, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
    osc.connect(g); g.connect(sfxGain); osc.start(t); osc.stop(t+0.26);
  });
}
function sfxBalloons(){
  const ctx = getCtx(); if(!ctx || !soundOn) return;
  ensureGains();
  // soft upward "whoosh/boing"
  const t = ctx.currentTime;
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(220,t);
  osc.frequency.exponentialRampToValueAtTime(660, t+0.45);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.16, t+0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.6);
  osc.connect(g); g.connect(sfxGain); osc.start(t); osc.stop(t+0.65);
}
function sfxFireworks(){
  const ctx = getCtx(); if(!ctx || !soundOn) return;
  ensureGains();
  const t0 = ctx.currentTime;
  // little "launch" then a sparkly crackle of short noise bursts
  const launch = ctx.createOscillator(); const lg = ctx.createGain();
  launch.type='sine'; launch.frequency.setValueAtTime(440,t0);
  launch.frequency.exponentialRampToValueAtTime(880, t0+0.18);
  lg.gain.setValueAtTime(0.0001,t0);
  lg.gain.exponentialRampToValueAtTime(0.1,t0+0.03);
  lg.gain.exponentialRampToValueAtTime(0.0001,t0+0.2);
  launch.connect(lg); lg.connect(sfxGain); launch.start(t0); launch.stop(t0+0.22);
  // crackle: short filtered noise pops
  for(let i=0;i<10;i++){
    const t = t0 + 0.2 + Math.random()*0.5;
    const buf = ctx.createBuffer(1, ctx.sampleRate*0.05, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let j=0;j<data.length;j++) data[j] = (Math.random()*2-1)*Math.pow(1-j/data.length,2);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value = 1500 + Math.random()*2500; bp.Q.value=2;
    const g = ctx.createGain(); g.gain.value = 0.09;
    src.connect(bp); bp.connect(g); g.connect(sfxGain);
    src.start(t); src.stop(t+0.06);
  }
}

/* ---------- Master gain nodes (created lazily) ---------- */
let sfxGain = null, masterMusicGain = null;
function ensureGains(){
  const ctx = getCtx(); if(!ctx) return;
  if(!sfxGain){ sfxGain = ctx.createGain(); sfxGain.gain.value = 0.9; sfxGain.connect(ctx.destination); }
  if(!masterMusicGain){ masterMusicGain = ctx.createGain(); masterMusicGain.gain.value = 0.0; masterMusicGain.connect(ctx.destination); }
}

/* ---------- Soothing piano background loop ---------- */
// A calm melody in C major pentatonic so it never clashes with the voice.
const MELODY = [
  // [note frequency, beats]
  [523.25,1],[587.33,1],[659.25,1],[783.99,1],   // C5 D5 E5 G5
  [659.25,1],[587.33,1],[523.25,2],
  [440.00,1],[523.25,1],[587.33,1],[659.25,1],    // A4 C5 D5 E5
  [587.33,1],[523.25,1],[440.00,2],
  [659.25,1],[783.99,1],[880.00,1],[783.99,1],    // E5 G5 A5 G5
  [659.25,1],[587.33,1],[523.25,2],
  [392.00,1],[440.00,1],[523.25,1],[587.33,1],    // G4 A4 C5 D5
  [523.25,1],[440.00,1],[392.00,2]
];
const BEAT = 0.55;          // slower = calmer, more piano-like
let musicTimer = null;
let musicStep = 0;
let musicNextTime = 0;

function scheduleMusic(){
  const ctx = getCtx(); if(!ctx) return;
  // schedule a little ahead for smooth, gapless looping
  while(musicNextTime < ctx.currentTime + 0.6){
    const [freq, beats] = MELODY[musicStep % MELODY.length];
    const dur = beats * BEAT;
    // soft piano notes, gentle and quiet; notes ring a little into each other
    playNote(freq, musicNextTime, Math.min(dur*1.6, 1.5), 0.11);
    // soft bass an octave below on longer notes for warmth
    if(beats >= 2) playNote(freq*0.5, musicNextTime, 1.4, 0.05);
    musicNextTime += dur;
    musicStep++;
  }
}
function startMusic(){
  const ctx = getCtx(); if(!ctx) return;
  ensureGains();
  musicStep = 0;
  musicNextTime = ctx.currentTime + 0.1;
  // fade in
  masterMusicGain.gain.cancelScheduledValues(ctx.currentTime);
  masterMusicGain.gain.setValueAtTime(masterMusicGain.gain.value, ctx.currentTime);
  masterMusicGain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 1.4);
  if(musicTimer) clearInterval(musicTimer);
  musicTimer = setInterval(scheduleMusic, 250);
  scheduleMusic();
}
function stopMusic(){
  const ctx = getCtx();
  if(musicTimer){ clearInterval(musicTimer); musicTimer = null; }
  if(ctx && masterMusicGain){
    masterMusicGain.gain.cancelScheduledValues(ctx.currentTime);
    masterMusicGain.gain.setValueAtTime(masterMusicGain.gain.value, ctx.currentTime);
    masterMusicGain.gain.linearRampToValueAtTime(0.0, ctx.currentTime + 0.5);
  }
}

const REVEAL_DELAY = 3500; // Spelling: gap before image blurs in + word spoken (was 3000)
const REVEAL_DUR   = 2000; // emoji blur->clear duration (matches CSS)
const SPELL_GAP    = 1000; // Spelling: gap after the word before spelling letters
const PHRASE_GAP   = 1000; // Phrases: gap after phrase+voice
const STEP_DELAY   = 1000; // generic 1-second beat used in the new vocab/spell intros
let revealTimer = null;
let stepTimers  = [];      // sequential intro timers, cancelled on navigation
function clearStepTimers(){ stepTimers.forEach(t=>clearTimeout(t)); stepTimers = []; }
function step(fn, delay){ const t = setTimeout(fn, delay); stepTimers.push(t); return t; }
let spellTimer  = null;
let spellGen = 0;   // increments whenever spelling is (re)started or cancelled
function clearRevealTimer(){ if(revealTimer){ clearTimeout(revealTimer); revealTimer = null; } }
function clearSpellTimer(){ if(spellTimer){ clearTimeout(spellTimer); spellTimer = null; } spellGen++; }

// AUTO flow helper: after the word finishes speaking, wait SPELL_GAP, then spell.
// Driven by speak()'s onDone callback (reliable even on a cold first load).
function spellAfterGap(){
  const w = ITEMS[idx] ? ITEMS[idx].w : '';
  clearSpellTimer();
  spellTimer = setTimeout(()=>{
    spellTimer = null;
    // spell the letters, then say the whole word again
    spellLetters(()=>{
      if(!soundOn || mode !== 'spell') return;
      setTimeout(()=>{ speak(w); }, 300);
    });
  }, SPELL_GAP);
}

// Spell the current word's letters one-by-one (with highlight), then run onDone.
function spellLetters(onDone){
  const myGen = ++spellGen;
  const spans = wordEl.querySelectorAll('.lt');
  const seq = [];
  spans.forEach(sp=>{
    const ch = sp.getAttribute('data-letter');
    if(ch) seq.push({ letter: ch, span: sp });
  });
  if(!seq.length){ if(onDone) onDone(); return; }
  seq.forEach((item, i)=>{
    setTimeout(()=>{
      if(myGen !== spellGen || !soundOn || mode !== 'spell') return;  // stale -> abort
      const u = new SpeechSynthesisUtterance(item.letter);   // lowercase = no "capital"
      const v = pickVoice(); if(v) u.voice = v;
      u.rate = 0.7; u.pitch = 1.1;
      speechSynthesis.speak(u);
      clearLetterHighlights();
      item.span.classList.add('lit');
      if(i === seq.length - 1){
        setTimeout(()=>{
          if(myGen !== spellGen) return;
          item.span.classList.remove('lit'); if(onDone) onDone();
        }, 700);
      }
    }, i*650);
  });
}

// TAP-WORD flow: spell the letters first, then say the whole word at the end.
function spellThenWord(text){
  if(!soundOn || !window.speechSynthesis) return;
  spellLetters(()=>{
    if(!soundOn || mode !== 'spell') return;
    setTimeout(()=>{ speak(text); }, 250);   // small beat after the last letter
  });
}

// Render the word as per-letter spans. Real letters get a data-letter (lowercase
// for clean speech); spaces render as a gap span with no data-letter.
function buildLetterSpans(text){
  wordEl.textContent = '';
  for(const ch of text){
    const span = document.createElement('span');
    span.className = 'lt';
    span.textContent = ch;
    if(/[a-zA-Z]/.test(ch)){
      span.setAttribute('data-letter', ch.toLowerCase());
    } else {
      span.classList.add('space');   // space or punctuation: not spelled/highlighted
    }
    wordEl.appendChild(span);
  }
}
function clearLetterHighlights(){
  wordEl.querySelectorAll('.lt.lit').forEach(s=>s.classList.remove('lit'));
}

// Mode-aware render.
function render(){
  const item = ITEMS[idx];
  emojiEl.textContent = item.e;
  counterEl.textContent = `${MODES[mode].label} ${idx+1} of ${ITEMS.length}`;

  // The word: spelling mode renders it as individual letter spans (so each can
  // be highlighted as it's spelled); other modes use plain text.
  if(mode === 'spell'){
    buildLetterSpans(item.w);
  } else {
    wordEl.textContent = item.w;
  }

  // card pop
  cardEl.classList.remove('pop'); void cardEl.offsetWidth; cardEl.classList.add('pop');

  // reset all timing + animation state
  clearRevealTimer(); clearSpellTimer(); clearStepTimers();
  if(window.speechSynthesis) speechSynthesis.cancel();
  emojiEl.classList.remove('reveal','locked','wiggle','waiting');
  wordEl.classList.remove('reveal','reveal-fast','wordwaiting');
  void emojiEl.offsetWidth; void wordEl.offsetWidth;

  const w = item.w;

  if(mode === 'vocab'){
    // 3.1: "What's this?" -> 1s -> image appears -> 3s -> word + voice.
    emojiEl.classList.add('waiting');         // hide image during the question
    wordEl.classList.add('wordwaiting');      // hide word until the end
    void emojiEl.offsetWidth; void wordEl.offsetWidth;
    speak("What's this?");
    // after 1s: reveal the image (sharp)
    step(()=>{
      emojiEl.classList.remove('waiting');
      emojiEl.classList.add('locked');
      void emojiEl.offsetWidth;
    }, STEP_DELAY);
    // 3s after the image: reveal the word (2s blur) + say it
    step(()=>{
      wordEl.classList.remove('wordwaiting');
      void wordEl.offsetWidth;
      wordEl.classList.add('reveal');          // word blurs in over 2s
      speak(w);
    }, STEP_DELAY + 3000);
  }
  else if(mode === 'spell'){
    // 2.x (new): "What's this word?" -> 1s -> word appears with a quick 1s blur
    //            -> 3.5s gap -> image blurs in + word spoken -> +1s -> spell letters.
    emojiEl.classList.add('waiting');          // image hidden during the intro
    wordEl.classList.add('wordwaiting');       // word hidden until the question's beat
    void emojiEl.offsetWidth; void wordEl.offsetWidth;
    speak("What's this word?");
    // after 1s: word appears with a quick 1-second Gaussian blur
    step(()=>{
      wordEl.classList.remove('wordwaiting');
      void wordEl.offsetWidth;
      wordEl.classList.add('reveal-fast');     // word blurs in over 1s
    }, STEP_DELAY);
    // after the 3.5s gap (measured from when the word appears):
    revealTimer = setTimeout(()=>{
      revealTimer = null;
      emojiEl.classList.remove('waiting');
      void emojiEl.offsetWidth;
      emojiEl.classList.add('reveal');         // image blurs in
      speak(w, spellAfterGap);                 // say the word, then spell after gap
    }, STEP_DELAY + REVEAL_DELAY);
  }
  else { // phrase
    // 3.3: phrase + voice together, then 1s gap (no blur).
    emojiEl.classList.add('locked');           // show picture immediately
    speak(w);
    // PHRASE_GAP is a pacing pause before the child would move on; it's a
    // natural beat (no further audio), so we just keep it idle for 1s.
  }

  queueSave();
  resetIdle();
}

function next(){ idx = (idx + 1) % ITEMS.length; render(); }
function prev(){ idx = (idx - 1 + ITEMS.length) % ITEMS.length; render(); }

// Shared visual: cancel any pending intro, show picture sharp + wiggle, word visible.
function popImage(){
  clearRevealTimer(); clearStepTimers();
  emojiEl.classList.remove('waiting');
  emojiEl.classList.add('locked');
  // make sure the word is fully visible (in case a tap interrupts the intro)
  wordEl.classList.remove('wordwaiting');
  wordEl.classList.remove('reveal','reveal-fast');
  emojiEl.classList.remove('wiggle');
  void emojiEl.offsetWidth;
  emojiEl.classList.add('wiggle');
}

// Tapping the PICTURE: just say the word (never spells, in any mode).
function sayWord(){
  clearSpellTimer();
  popImage();
  speak(ITEMS[idx].w);
}

// Tapping the WORD (spelling mode): spell the letters, then say the whole word.
function sayAndSpell(){
  clearRevealTimer(); clearSpellTimer();
  popImage();
  spellThenWord(ITEMS[idx].w);
}

// Back-compat: keyboard space/enter uses the mode's default repeat behavior.
function repeat(){
  if(mode === 'spell') sayAndSpell();
  else sayWord();
}

/* ---------- Idle hint: show a translucent tapping hand after 7s of no action ---------- */
const IDLE_DELAY = 15000;
let idleTimer = null;
let handPlaying = false;
function hideHand(){
  handPlaying = false;
  tapHand.classList.remove('show');
  tapRing.classList.remove('show');
}
function showHand(){
  // only inside a mode, and not while the jump dialog is open
  if(!mode){ return; }
  if(jumpModal.classList.contains('open')) { resetIdle(); return; }
  handPlaying = true;
  tapHand.classList.remove('show'); tapRing.classList.remove('show');
  void tapHand.offsetWidth;
  tapHand.classList.add('show'); tapRing.classList.add('show');
}
function resetIdle(){
  hideHand();
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(showHand, IDLE_DELAY);
}
// After the hand plays its 2 taps, hide it and restart the 7s countdown.
tapHand.addEventListener('animationend', ()=>{
  if(!handPlaying) return;
  hideHand();
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(showHand, IDLE_DELAY);
});

/* ---------- Events ---------- */
document.getElementById('next').addEventListener('click', e=>{ e.stopPropagation(); next(); });
document.getElementById('prev').addEventListener('click', e=>{ e.stopPropagation(); prev(); });
// Tap routing inside the card:
//  - tap the WORD (or its letters) in spelling mode -> spell, then say the word
//  - tap the PICTURE -> just say the word (no spelling) in any mode
//  - in non-spelling modes, tapping the word also just says the word
cardEl.addEventListener('click', e=>{
  e.stopPropagation();
  const onWord = e.target.closest('.word');
  if(onWord && mode === 'spell'){
    sayAndSpell();
  } else {
    sayWord();
  }
});

// Keyboard (laptop friendly)
document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight') next();
  else if(e.key === 'ArrowLeft') prev();
  else if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); repeat(); }
});

// Swipe (only when starting on the card area, so outside-taps still fire effects)
let startX = null, startY = null, swipeFromCard = false;
document.addEventListener('touchstart', e=>{
  startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  swipeFromCard = !!e.target.closest('.card, .arrow, .counter, .modal, .toggle');
}, {passive:true});
document.addEventListener('touchend', e=>{
  if(startX === null) return;
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)){ dx < 0 ? next() : prev(); }
  startX = startY = null;
}, {passive:true});

// Voice + effects toggle (label reflects real state; default off)
document.getElementById('soundToggle').addEventListener('click', function(e){
  e.stopPropagation();
  soundOn = !soundOn;
  this.textContent = soundOn ? '🔊 Sound: On' : '🔇 Sound: Off';
  this.classList.toggle('off', !soundOn);
  if(soundOn){
    const ctx = getCtx();                 // create+resume inside the gesture
    ensureGains();
    chime();                              // immediate audible confirmation
    if(mode) speak(ITEMS[idx].w);
    // If the audio context can't run (e.g. sandboxed preview iframe), let the user know.
    setTimeout(()=>{
      if(audioCtx && audioCtx.state !== 'running'){
        showAudioNote();
      }
    }, 300);
  } else if(window.speechSynthesis){ speechSynthesis.cancel(); }
});

let audioNoteShown = false;

/* ---------- Feature 2: Jump to a word ---------- */
const jumpModal  = document.getElementById('jumpModal');
const jumpInput  = document.getElementById('jumpInput');
const jumpHint   = document.getElementById('jumpHint');
function openJump(){
  const noun = MODES[mode] ? MODES[mode].label.toLowerCase() : 'word';
  jumpHint.textContent = `Enter a number from 1 to ${ITEMS.length}`;
  jumpModal.querySelector('h2').textContent = `Go to a ${noun}`;
  jumpInput.value = idx + 1;
  jumpInput.max = ITEMS.length;
  jumpModal.classList.add('open');
  setTimeout(()=>{ jumpInput.focus(); jumpInput.select(); }, 50);

function doJump(){

document.getElementById('jumpGo').addEventListener('click', e=>{ e.stopPropagation(); doJump(); });
document.getElementById('jumpCancel').addEventListener('click', e=>{ e.stopPropagation(); closeJump(); });
jumpInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doJump(); else if(e.key==='Escape') closeJump(); });

/* ---------- Feature 4: Background celebrations on outside-tap ---------- */
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
let DPR = Math.min(window.devicePixelRatio || 1, 2);
function sizeCanvas(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(innerWidth  * DPR);
  canvas.height = Math.floor(innerHeight * DPR);
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
sizeCanvas();
window.addEventListener('resize', sizeCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(sizeCanvas,200));

const PALETTE = ['#ff8fab','#ffd6a5','#b8f2e6','#cdb4ff','#9bf6ff','#ffc8dd','#ffadad','#caffbf'];
const pick = a => a[(Math.random()*a.length)|0];
let particles = [];
let rafId = null;

function ensureLoop(){
  if(rafId) return;
  const step = ()=>{
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.update();
      p.draw(ctx);
      if(p.dead) particles.splice(i,1);
    }
    if(particles.length){ rafId = requestAnimationFrame(step); }
    else { rafId = null; ctx.clearRect(0,0,innerWidth,innerHeight); }
  };
  rafId = requestAnimationFrame(step);
}

/* --- Bubbles: rise and gently wobble, then pop --- */
class Bubble{
  constructor(x,y){
    this.x=x; this.y=y;
    this.r = 10 + Math.random()*26;
    this.vy = -(0.6 + Math.random()*1.6);
    this.vx = (Math.random()-0.5)*0.8;
    this.life = 0; this.max = 120 + Math.random()*80;
    this.color = pick(PALETTE);
    this.wob = Math.random()*Math.PI*2;
    this.dead=false;
  }
  update(){
    this.life++;
    this.wob += 0.06;
    this.x += this.vx + Math.sin(this.wob)*0.6;
    this.y += this.vy;
    if(this.life>this.max || this.y < -40) this.dead=true;
  }
  draw(c){
    const a = Math.max(0, 1 - this.life/this.max);
    c.beginPath();
    c.arc(this.x,this.y,this.r,0,Math.PI*2);
    c.fillStyle = this.color + Math.floor(a*70).toString(16).padStart(2,'0');
    c.fill();
    c.lineWidth=2;
    c.strokeStyle = this.color + Math.floor(a*180).toString(16).padStart(2,'0');
    c.stroke();
    // little highlight
    c.beginPath();
    c.arc(this.x - this.r*0.3, this.y - this.r*0.3, this.r*0.25, 0, Math.PI*2);
    c.fillStyle = 'rgba(255,255,255,'+(a*0.7)+')';
    c.fill();
  }
}

/* --- Balloons: rise with a string --- */
class Balloon{
  constructor(x,y){
    this.x=x; this.y=y;
    this.r = 22 + Math.random()*16;
    this.vy = -(1.1 + Math.random()*1.3);
    this.sway = Math.random()*Math.PI*2;
    this.color = pick(PALETTE);
    this.life=0; this.max=200;
    this.dead=false;
  }
  update(){
    this.life++;
    this.sway += 0.04;
    this.x += Math.sin(this.sway)*0.7;
    this.y += this.vy;
    if(this.y < -80 || this.life>this.max) this.dead=true;
  }
  draw(c){
    const a = Math.max(0, 1 - this.life/this.max);
    const col = this.color + Math.floor(a*255).toString(16).padStart(2,'0');
    // string
    c.beginPath();
    c.moveTo(this.x, this.y + this.r);
    c.quadraticCurveTo(this.x + 6, this.y + this.r + 18, this.x, this.y + this.r + 34);
    c.strokeStyle = 'rgba(150,130,180,'+(a*0.6)+')';
    c.lineWidth=1.5; c.stroke();
    // body
    c.beginPath();
    c.ellipse(this.x, this.y, this.r*0.82, this.r, 0, 0, Math.PI*2);
    c.fillStyle = col; c.fill();
    // shine
    c.beginPath();
    c.ellipse(this.x - this.r*0.3, this.y - this.r*0.35, this.r*0.18, this.r*0.28, -0.4, 0, Math.PI*2);
    c.fillStyle='rgba(255,255,255,'+(a*0.6)+')'; c.fill();
  }
}

/* --- Fireworks: a burst of sparks --- */
class Spark{
  constructor(x,y,color){
    this.x=x; this.y=y;
    const ang = Math.random()*Math.PI*2;
    const sp = 1.5 + Math.random()*4.5;
    this.vx=Math.cos(ang)*sp; this.vy=Math.sin(ang)*sp;
    this.life=0; this.max=50+Math.random()*30;
    this.color=color; this.dead=false;
  }
  update(){
    this.life++;
    this.vy += 0.05;   // gravity
    this.vx *= 0.98; this.vy *= 0.98;
    this.x += this.vx; this.y += this.vy;
    if(this.life>this.max) this.dead=true;
  }
  draw(c){
    const a = Math.max(0,1-this.life/this.max);
    c.beginPath();
    c.arc(this.x,this.y,2.6,0,Math.PI*2);
    c.fillStyle = this.color + Math.floor(a*255).toString(16).padStart(2,'0');
    c.fill();
  }
}

let fxMode = 0; // rotate through the three effects so it feels varied
function celebrate(x,y){
  const mode = fxMode % 3; fxMode++;
  if(mode === 0){
    for(let i=0;i<16;i++) particles.push(new Bubble(x + (Math.random()-0.5)*60, y + (Math.random()-0.5)*30));
    sfxBubbles();
  } else if(mode === 1){
    for(let i=0;i<7;i++)  particles.push(new Balloon(x + (Math.random()-0.5)*90, y));
    sfxBalloons();
  } else {
    const col = pick(PALETTE);
    for(let i=0;i<46;i++) particles.push(new Spark(x,y, Math.random()<0.5?col:pick(PALETTE)));
    sfxFireworks();
  }
  ensureLoop();
}

// Outside-tap detector: ignore taps on the card, arrows, counter, footer, modal.
function isInteractive(t){
  return t && t.closest && t.closest('.card, .arrow, .counter, .toggle, .modal, header h1');
}
// Track press start to tell a tap from a swipe/scroll.
let pressX = null, pressY = null, pressMoved = false;
document.addEventListener('touchstart', e=>{
  pressX = e.touches[0].clientX; pressY = e.touches[0].clientY; pressMoved = false;
}, {passive:true});
document.addEventListener('touchmove', e=>{
  if(pressX === null) return;
  const dx = e.touches[0].clientX - pressX, dy = e.touches[0].clientY - pressY;
  if(Math.hypot(dx,dy) > 12) pressMoved = true;
}, {passive:true});
document.addEventListener('touchend', e=>{
  if(!mode) return;                            // no effects on the landing screen
  const t = e.changedTouches[0];
  const wasTap = !pressMoved;
  pressX = pressY = null;
  if(!wasTap) return;                          // it was a swipe -> no fireworks
  const el = document.elementFromPoint(t.clientX, t.clientY);
  if(isInteractive(el)) return;                // tapped a control -> no fireworks
  celebrate(t.clientX, t.clientY);
}, {passive:true});

// Mouse / trackpad clicks (laptops). Touch is handled above; guard against
// double-firing by only acting when there was no recent touch.
let lastTouch = 0;
document.addEventListener('touchend', ()=>{ lastTouch = Date.now(); }, {passive:true});
document.addEventListener('click', e=>{
  if(!mode) return;                            // no effects on the landing screen
  if(Date.now() - lastTouch < 600) return;     // already handled by touchend
  if(isInteractive(e.target)) return;
  celebrate(e.clientX, e.clientY);
});

/* ---------- Any user activity resets the idle hand timer ---------- */
['pointerdown','keydown','touchstart','wheel'].forEach(evt=>{
  document.addEventListener(evt, resetIdle, {passive:true});
});

/* ---------- First-interaction audio unlock (Edit 1) ----------
   Browsers block speech until the user interacts once, so the very first
   "Dog" on load stays silent. On the first tap/key anywhere, say the current
   word so the child hears it right away. Runs only once. */
let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  // Nudge the speech engine awake, then speak the item currently on screen.
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  if(mode) speak(ITEMS[idx].w);
}
['pointerdown','keydown','touchstart'].forEach(evt=>{
  document.addEventListener(evt, unlockAudio, {passive:true});
});

/* ---------- Mode entry / exit ---------- */
async function enterMode(m){
  if(!MODES[m]) return;
  mode = m;
  ITEMS = MODES[m].data;
  idx = await loadProgressFor(m);          // per-mode resume
  document.body.classList.add('in-mode');
  // make sure the canvas is sized now that the stage is visible
  if(typeof sizeCanvas === 'function') sizeCanvas();
  // Warm up the speech engine within this user gesture so the first word
  // (which fires a few seconds later) reliably plays on a cold load.
  try{
    if(window.speechSynthesis){
      const warm = new SpeechSynthesisUtterance(' ');
      warm.volume = 0;
      speechSynthesis.speak(warm);
    }
  }catch(e){}
  render();                                 // mode-aware render handles timing/animation
}
function goToMenu(){
  saveProgress();
  clearRevealTimer(); clearSpellTimer(); clearStepTimers();
  if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
  if(window.speechSynthesis) speechSynthesis.cancel();
  hideHand();
  mode = null;
  document.body.classList.remove('in-mode');
}

// Wire landing buttons + back button
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click', e=>{
    e.stopPropagation();
    getCtx();                               // resume audio within this gesture
    enterMode(btn.getAttribute('data-mode'));
  });
});
backBtn.addEventListener('click', e=>{ e.stopPropagation(); goToMenu(); });

/* ---------- Boot: show the landing screen (no mode yet) ---------- */
window.addEventListener('load', ()=>{
  document.body.classList.remove('in-mode');  // ensure landing shows first
  mode = null;
});
</script>
